name: Docs

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/src/**'
      - 'backend/docs/**'
      - 'backend/typedoc.json'
      - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dockerize:
    permissions:
      contents: read
      packages: write
    uses: GEWIS/actions/.github/workflows/docker-branch-release.yml@v1
    with:
      projects: '["."]'
      docker-paths: '["${{ vars.DOCKER_DOCS_TAG }}"]'
      github-registry: 'true'
      dockerfile: './backend/Dockerfile-docs'
