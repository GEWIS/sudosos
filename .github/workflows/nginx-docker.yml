name: NGINX

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/lib/nginx/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/lib/nginx/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-preview:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    uses: GEWIS/actions/.github/workflows/docker-build.yml@v1
    with:
      projects: '["frontend/lib/nginx"]'

  dockerize:
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
    uses: GEWIS/actions/.github/workflows/docker-branch-release.yml@v1
    with:
      projects: '["frontend/lib/nginx"]'
      docker-paths: '["${{ vars.DOCKER_TAG_NGINX }}"]'
      docker-registry: ${{ vars.DOCKER_REGISTRY }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.SVC_GH_SUDOSOS_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.SVC_GH_SUDOSOS_PWD }}
