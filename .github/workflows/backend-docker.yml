name: Backend Docker

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/backend-docker.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/backend-docker.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-preview:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    uses: GEWIS/actions/.github/workflows/docker-build.yml@v1
    with:
      projects: '["."]'
      dockerfile: './backend/Dockerfile'

  dockerize:
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
    uses: GEWIS/actions/.github/workflows/docker-branch-release.yml@v1
    with:
      projects: '["."]'
      docker-paths: '["${{ vars.DOCKER_TAG }}"]'
      docker-registry: ${{ vars.DOCKER_REGISTRY }}
      dockerfile: './backend/Dockerfile'
    secrets:
      REGISTRY_USERNAME: ${{ secrets.SVC_GH_SUDOSOS_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.SVC_GH_SUDOSOS_PWD }}
