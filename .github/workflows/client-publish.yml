name: Publish Client Snapshot

on:
  push:
    branches: [develop]
    paths:
      - 'backend/src/**'
      - 'backend/package.json'
      - 'packages/sudosos-client/**'

concurrency:
  group: publish-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate:client
      - run: pnpm --filter @gewis/sudosos-client build
      - name: Set snapshot version
        working-directory: packages/sudosos-client
        run: npm version "0.0.0-develop.$(git rev-parse --short HEAD)" --no-git-tag-version
      - name: Publish to npm
        working-directory: packages/sudosos-client
        run: npm publish --tag develop
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
