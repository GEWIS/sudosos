name: Backend Coverage Baseline

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'packages/sudosos-client/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/backend-coverage-baseline.yml'

concurrency:
  group: coverage-baseline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read

jobs:
  coverage:
    name: coverage-mariadb
    runs-on: ubuntu-latest
    container:
      image: node:22
    services:
      mariadb:
        image: mariadb:lts
        env:
          MARIADB_RANDOM_ROOT_PASSWORD: true
          MARIADB_DATABASE: sudosos-ci
          MARIADB_USER: sudosos-ci
          MARIADB_PASSWORD: sudosos-ci
    env:
      NAME: sudosos-test
      NODE_ENV: development
      API_BASEPATH: /v1
      GEWISWEB_JWT_SECRET: ChangeMe
      TYPEORM_CONNECTION: mariadb
      TYPEORM_HOST: mariadb
      TYPEORM_PORT: 3306
      TYPEORM_USERNAME: sudosos-ci
      TYPEORM_PASSWORD: sudosos-ci
      TYPEORM_DATABASE: sudosos-ci
      TYPEORM_SYNCHRONIZE: "false"
      TYPEORM_LOGGING: false
      ENABLE_LDAP: true
      STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_SUDOSOS_TEST_KEY }}
      STRIPE_PRIVATE_KEY: ${{ secrets.STRIPE_SUDOSOS_TEST_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_TEST_SECRET }}
      SKIP_SQLITE_DEFAULTS: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: npm install -g pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p backend/config && openssl genrsa -out backend/config/jwt.key 2048 && chmod 0777 backend/config/jwt.key
      - run: pnpm --filter sudosos-backend run swagger:validate
      - run: pnpm --filter sudosos-backend run coverage-ci-migrate
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Upload code coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/reports/coverage/
          retention-days: 7
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./backend/reports/coverage/lcov.info
          base-path: backend
