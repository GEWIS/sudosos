name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versioning:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: GEWIS/actions/.github/workflows/versioning.yml@v1
    with:
      node-version: '22.x'

  publish-client:
    runs-on: ubuntu-latest
    needs: versioning
    if: ${{ needs.versioning.outputs['next-version'] != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate:client
      - run: pnpm --filter @gewis/sudosos-client build
      - name: Set release version
        working-directory: packages/sudosos-client
        run: npm version "${{ needs.versioning.outputs['next-version'] }}" --no-git-tag-version
      - name: Publish to npm
        working-directory: packages/sudosos-client
        run: npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  backend-release:
    permissions:
      contents: read
      packages: write
    needs: versioning
    if: ${{ needs.versioning.outputs['next-version'] != '' }}
    uses: GEWIS/actions/.github/workflows/docker-release.yml@v1
    with:
      projects: '["."]'
      docker-paths: '["${{ vars.DOCKER_TAG }}"]'
      docker-registry: ${{ vars.DOCKER_REGISTRY }}
      dockerfile: './backend/Dockerfile'
      version: ${{ needs.versioning.outputs['next-version'] }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.SVC_GH_SUDOSOS_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.SVC_GH_SUDOSOS_PWD }}

  frontend-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: versioning
    if: ${{ needs.versioning.outputs['next-version'] != '' }}
    strategy:
      matrix:
        app: [dashboard, point-of-sale]
        include:
          - app: dashboard
            docker_tag_var: DOCKER_TAG_DASHBOARD
          - app: point-of-sale
            docker_tag_var: DOCKER_TAG_POS
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory '*'
      - run: echo "GIT_COMMIT_SHA=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_ENV
      - name: Set up environment
        env:
          ENV_FILE: ${{ vars.ENV_FILE_PRODUCTION }}
        run: echo "${ENV_FILE}" > ./frontend/apps/${{ matrix.app }}/.env
      - id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ vars.DOCKER_REGISTRY }}/${{ vars[matrix.docker_tag_var] }}
          tags: ${{ needs.versioning.outputs['next-version'] }}
      - uses: docker/setup-qemu-action@v2
      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v2
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.SVC_GH_SUDOSOS_USERNAME }}
          password: ${{ secrets.SVC_GH_SUDOSOS_PWD }}
      - uses: docker/build-push-action@v3
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT_BRANCH=${{ github.head_ref || github.ref_name }}
            GIT_COMMIT_SHA=${{ env.GIT_COMMIT_SHA }}
          file: frontend/apps/${{ matrix.app }}/Dockerfile
