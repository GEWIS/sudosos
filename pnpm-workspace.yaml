packages:
  - backend
  - packages/sudosos-client
  - frontend/apps/dashboard
  - frontend/apps/point-of-sale
  - frontend/lib/common
  - frontend/lib/themes

allowBuilds:
  '@openapitools/openapi-generator-cli': true
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true

catalog:
  axios: 1.20.0
  vue: ^3.5.43
  pinia: ^3.0.4
  typescript: ~5.9.3
  vite: ^8.3.1
  vue-tsc: ^3.3.11
  eslint: ^9.39.1
  '@vitejs/plugin-vue': ^6.0.9
  vite-plugin-dts: ^4.5.4
  '@vue/tsconfig': ^0.9.1
  '@typescript-eslint/parser': ^8.49.0
  vue-eslint-parser: ^10.2.0
  sass: ^1.103.1
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  tailwindcss-primeui: ^0.6.1
  primevue: ^4.5.2
  primeicons: ^7.0.0
  '@primeuix/themes': ^2.0.2
  '@gewis/eslint-config-typescript': ^2.4.0
  '@gewis/eslint-config-vue': ^2.4.0
  '@gewis/prettier-config': ^2.2.2
